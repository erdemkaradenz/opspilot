
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: opspilot-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5444:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - opspilot-network
  
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: opspilot-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Web UI (İzleri buradan izleyeceksin)
      - "4317:4317"   # OTLP gRPC (OpenTelemetry verileri buraya akacak)
      - "4318:4318"   # OTLP HTTP
    networks:
      - opspilot-network

  redis:
    image: redis:7-alpine
    container_name: opspilot-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes # AOF (Append Only File) açık, veri kaybı yasak!
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - opspilot-network

  kafka:
    image: apache/kafka:3.7.0
    container_name: opspilot-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opspilot-network

  n8n:
    # Doğru, resmi ve yaygın Docker Hub imajını kullanıyoruz.
    image: n8nio/n8n:latest 
    container_name: opspilot-n8n
    restart: unless-stopped
    ports:
      # SADECE localhost'tan erişilebilir. Dış dünyaya kapalı! Güvenlik budur.
      - "127.0.0.1:${N8N_PORT}:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - GENERIC_TIMEZONE=Europe/Istanbul
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - opspilot-network

volumes:
  pgdata:
  redisdata:
  kafkadata:
  n8n_data:

networks:
  opspilot-network:
    driver: bridge