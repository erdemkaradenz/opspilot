[project]
name = "opspilot"
version = "0.1.0"
description = ""
authors = [
    {name = "erdemkaradenz",email = "erdemkaradeniz327@hotmail.com"}
]
requires-python = ">=3.10, <4.0"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "aiokafka (>=0.14.0,<0.15.0)",
    "redis (>=8.1.0,<9.0.0)",
    "fastapi-limiter (>=0.2.0,<0.3.0)",
    "opentelemetry-api (>=1.44.0,<2.0.0)",
    "opentelemetry-sdk (>=1.44.0,<2.0.0)",
    "opentelemetry-exporter-otlp (>=1.44.0,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.65b0,<0.66)",
    "opentelemetry-instrumentation-sqlalchemy (>=0.65b0,<0.66)",
    "openai (>=3.14.1,<4.0.0)",
    "pgvector (>=0.5.0,<0.6.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "tenacity (>=9.1.4,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.16.7,<0.17.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
